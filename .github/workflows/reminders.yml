name: Yelo mail reminders

on:
  schedule:
    - cron: "30 9,14,16 * * 1-5"
      timezone: "Asia/Baku"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yelo-mail-reminders
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder and collect confirmations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reminder.py
