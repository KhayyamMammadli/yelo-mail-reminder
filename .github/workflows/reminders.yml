name: Yelo mail reminders

on:
  schedule:
    # Baku time (UTC+4): 09:30, 14:30, 16:30, and 18:30 on weekdays.
    - cron: "30 5 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: yelo-mail-reminders
  cancel-in-progress: false

jobs:
  send-reminder:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '30 14 * * 1-5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder and collect confirmations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_MEMBERS: ${{ secrets.TELEGRAM_GROUP_MEMBERS }}
        run: python reminder.py
      - name: Save private confirmation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmation-record-${{ github.run_id }}
          path: confirmation-record.json
          retention-days: 2
          if-no-files-found: warn

  daily-report:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 14 * * 1-5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send daily confirmation report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_MEMBERS: ${{ secrets.TELEGRAM_GROUP_MEMBERS }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python daily_report.py
