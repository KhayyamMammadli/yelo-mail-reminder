services:
  - type: cron
    name: yelo-mail-reminder
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    schedule: "0 6 * * 1-5" # 10:00 Baku time, weekdays
    buildCommand: python -m py_compile render_reminders.py
    startCommand: python render_reminders.py
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_GROUP_MEMBERS
        sync: false
